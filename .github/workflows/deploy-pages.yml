name: Verify dev without public preview

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-qa
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl
          tools: composer:v2
          coverage: none

      - name: Install locked backend dependencies without secrets
        run: |
          composer validate --strict --working-dir=backend
          composer install --working-dir=backend --no-dev --prefer-dist --no-scripts --no-plugins --no-interaction --classmap-authoritative
          composer audit --working-dir=backend --locked --no-dev

      - name: Verify
        run: npm run typecheck && npm test && npm run test:deploy && npm run test:backend

      - name: Build
        run: npm run build
        env:
          SITE_NOINDEX: 'true'
          SITE_BASE_PATH: /

      - name: Prepare and test the production package with Apache and PHP
        env:
          SITE_NOINDEX: 'true'
        run: |
          node scripts/prepare-ionos.mjs
          docker build -t webbyu-inquiry-test -f backend/tests/Apache.Dockerfile dist
          docker run -d --name webbyu-inquiry-test -p 127.0.0.1:8088:80 webbyu-inquiry-test
          for attempt in {1..30}; do curl --silent --output /dev/null http://127.0.0.1:8088/api/health.php && break || sleep 1; done
          node scripts/test-apache.mjs

      - name: Remove test container
        if: always()
        run: docker rm -f webbyu-inquiry-test 2>/dev/null || true

      # QA runs checks and a build only. No Pages deployment or build upload.
