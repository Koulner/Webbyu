name: Verify dev without public preview

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-qa
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run typecheck && npm test && npm run test:deploy

      - name: Build
        run: npm run build
        env:
          SITE_NOINDEX: 'true'

      # QA runs checks and a build only. No Pages deployment or build upload.
