    <noscript><main style="max-width:48rem;margin:3rem auto;padding:1.5rem;font:18px/1.7 sans-serif"><h1>Der Weg von Webbyu</h1><p>Ich plane, gestalte und entwickle individuelle Websites. Eine klare Frage ist der Anfang: Was soll für Ihre Kunden und Ihre tägliche Arbeit leichter werden?</p><h2>Von der Idee zum Fundament</h2><p>Inhalte, Gestaltung und Funktion werden gemeinsam gedacht.</p><h2>Vier Konzeptstudien</h2><p>Meisterwerk: Raumwünsche sammeln. Nordlicht: technische Anliegen einordnen. Safran Atelier: ein Produkt entdecken. Raumgut: Möbel auswählen und den Einkauf vorbereiten.</p><p>Die Arbeiten zeigen fiktive Marken, keine Kundenreferenzen. Die interaktiven Erlebnisräume und Demos benötigen JavaScript.</p><a href="%BASE_URL%#projektfinder">Zur Webbyu-Startseite</a></main></noscript>
